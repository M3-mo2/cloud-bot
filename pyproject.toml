[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-bot"
version = "0.1.0"
description = "Operator-owned Telegram frontend for the Cloud Service sandbox engine"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "babel>=2.15",
    "structlog>=24.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["cloudbot*"]

[tool.setuptools.package-data]
cloudbot = ["adapters/persistence/migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: runs against a live engine; requires CLOUDBOT_LIVE_ENGINE=1",
]
addopts = "-p no:cacheprovider"
