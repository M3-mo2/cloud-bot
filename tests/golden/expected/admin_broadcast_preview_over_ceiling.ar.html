<p>▬▬▭▭▬▬▭▭▬▬▭▭</p><h2>📢 الإذاعة</h2><p>▬▬▭▭▬▬▭▭▬▬▭▭</p><h3>👀 معاينة</h3><p>هذه الرسالة نفسها ستُنسخ لكل مستلم. لا شيء يُضاف قبلها أو بعدها.</p><blockquote>سيُرسل إلى 9000 مستخدم. · <code>6508129575:77</code></blockquote><blockquote>⚠️ هذا الجمهور (9000) أكبر من سقف الإرسال الواحد (5000). اضغط «أرسل رغم ذلك» لتأكيد هذا العدد الأكبر، أو اختر جمهورًا أصغر.</blockquote>
